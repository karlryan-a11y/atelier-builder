<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- Home-screen app on an iPhone or iPad (Karl, 2026-11-14: "every page the team uses"). Paths sit
         under /brand/ because the dashboard passes /brand/* through to this app, so they answer the
         same on atelierbywatson.com/style and on the builder's own address. iOS reads only the
         apple-prefixed capable tag. viewport-fit=cover lets the black header run under the notch;
         the padding in index.css keeps every button out of it and off the home bar.
         scripts/check-home-screen-app.mjs guards all of it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/brand/atelier-style.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atelier" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050505" />
    <title>Atelier by Watson</title>
    <!-- Preload the brand script (Amalfi Coast = the default canvas label font) so it's cached
         before the stylist ever opens the text tool — kills the fallback→Amalfi Coast flash. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/AmalfiCoast.woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display+SC:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      /* WSG-style preloader — W logo fade-in + gentle pulse on dark bg */
      .atelier-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #050505;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .atelier-preloader.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .atelier-preloader__logo {
        width: 180px;
        height: auto;
        opacity: 0;
        animation:
          preloader-fade-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards,
          preloader-pulse 2.5s cubic-bezier(0.45, 0, 0.55, 1) 0.6s infinite;
      }
      @keyframes preloader-fade-in {
        from { opacity: 0; transform: scale(0.92); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes preloader-pulse {
        0%   { opacity: 1; transform: scale(1); }
        50%  { opacity: 0.65; transform: scale(0.97); }
        100% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .atelier-preloader { display: none; }
      }
    </style>
  </head>
  <body>
    <!-- Preloader — dismissed by React once the app mounts -->
    <div class="atelier-preloader" id="atelier-preloader" aria-hidden="true">
      <img class="atelier-preloader__logo" src="/brand/w-icon-white.svg" alt="" width="60" height="60" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
